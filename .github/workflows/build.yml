name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # 构建图标必须入库（app-builder 找不到 build/icon.* 时会回退扫描 icons/ 并 panic）
      - name: Verify build resources
        shell: bash
        run: |
          for f in build/icon.ico build/icon.icns build/icon.png; do
            if [ ! -f "$f" ]; then echo "::error file=$f::missing $f — commit the build/ directory"; exit 1; fi
          done
          echo "build resources OK"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # electron / electron-builder 下载缓存（含各平台缓存路径）
      - name: Cache electron & electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-ebuilder-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-ebuilder-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build (macOS x64 + arm64)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macdows-explorer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
