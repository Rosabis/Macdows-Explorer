<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:;" />
  <title>此电脑</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ======== 标题栏 ======== -->
  <div id="titlebar">
    <div class="tb-left">
      <img id="app-icon" src="" alt="" />
      <span id="win-title">此电脑</span>
    </div>
    <div class="tb-buttons">
      <button id="btn-min" title="最小化">&#x2500;</button>
      <button id="btn-max" title="最大化 / 全屏">&#x25A1;</button>
      <button id="btn-close" title="关闭">&#x2715;</button>
    </div>
  </div>

  <!-- ======== 功能区选项卡 ======== -->
  <div id="ribbon">
    <div id="ribbon-tabs">
      <div class="rtab active" data-tab="wenjian">文件</div>
      <div class="rtab" data-tab="jisuanji">计算机</div>
      <div class="rtab" data-tab="zhuye">主页</div>
      <div class="rtab" data-tab="gongxiang">共享</div>
      <div class="rtab" data-tab="chakan">查看</div>
      <div id="ribbon-collapse" title="收拢功能区（点击可展开）">&#x2227;</div>
      <div class="rtab-help" title="帮助">&#x2B50;</div>
    </div>
    <div id="ribbon-body">
      <!-- 文件 -->
      <div class="rpanel" data-panel="wenjian">
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd big" id="cmd-props1"><img class="ric" src="../icons/Icons/files/configuration.ico"/><span class="rlab">属性</span></button>
            <button class="rcmd big" id="cmd-open1"><img class="ric" src="../icons/Icons/files/window.ico"/><span class="rlab">打开</span></button>
            <button class="rcmd big" id="cmd-rename1"><img class="ric" src="../icons/Icons/files/select.ico"/><span class="rlab">重命名</span></button>
          </div>
          <div class="rgroup-title">位置</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd big" id="cmd-newfolder"><img class="ric" src="../icons/Icons/folders/folder.ico"/><span class="rlab">新建文件夹</span></button>
            <button class="rcmd big" id="cmd-settings1"><img class="ric" src="../icons/Icons/files/configuration2.ico"/><span class="rlab">打开设置</span></button>
          </div>
          <div class="rgroup-title">新建</div>
        </div>
      </div>
      <!-- 计算机（根视图专用） -->
      <div class="rpanel" data-panel="jisuanji">
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd big" id="cmd-appwiz"><img class="ric" src="../icons/Icons/applications/accessories.ico"/><span class="rlab2">卸载或更改程序</span></button>
            <button class="rcmd big" id="cmd-sysdm"><img class="ric" src="../icons/Icons/files/window.ico"/><span class="rlab2">系统属性</span></button>
            <button class="rcmd big" id="cmd-mgmt"><img class="ric" src="../icons/Icons/folders/explorer.ico"/><span class="rlab2">管理</span></button>
          </div>
          <div class="rgroup-title">系统</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd big" id="cmd-mapnet"><img class="ric" src="../icons/Icons/folders/network.ico"/><span class="rlab2">映射网络驱动器</span></button>
            <button class="rcmd big" id="cmd-addnet"><img class="ric" src="../icons/Icons/folders/network2.ico"/><span class="rlab2">添加一个网络位置</span></button>
          </div>
          <div class="rgroup-title">网络</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd big" id="cmd-settings2"><img class="ric" src="../icons/Icons/files/configuration2.ico"/><span class="rlab2">打开设置</span></button>
          </div>
          <div class="rgroup-title">&nbsp;</div>
        </div>
      </div>
      <!-- 主页 -->
      <div class="rpanel" data-panel="zhuye">
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd big" id="cmd-pin"><img class="ric" src="../icons/Icons/folders/favorites.ico"/><span class="rlab">固定到快速访问</span></button>
            <button class="rcmd big" id="cmd-paste"><img class="ric" src="../icons/Icons/files/move.ico"/><span class="rlab">粘贴</span></button>
            <div class="rstack">
              <button class="rcmd small" id="cmd-cut"><img class="ric" src="../icons/Icons/files/select.ico"/><span class="rlab">剪切</span></button>
              <button class="rcmd small" id="cmd-copy"><img class="ric" src="../icons/Icons/files/copy.ico"/><span class="rlab">复制</span></button>
              <button class="rcmd small" id="cmd-copypath"><img class="ric" src="../icons/Icons/files/document.ico"/><span class="rlab">复制路径</span></button>
              <button class="rcmd small" id="cmd-pasteshort"><img class="ric" src="../icons/Icons/folders/links.ico"/><span class="rlab">粘贴快捷方式</span></button>
            </div>
          </div>
          <div class="rgroup-title">剪贴板</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd big" id="cmd-moveto"><img class="ric" src="../icons/Icons/files/move.ico"/><span class="rlab">移动到 <span class="rcaret">&#x25BE;</span></span></button>
            <button class="rcmd big" id="cmd-copyto"><img class="ric" src="../icons/Icons/files/copy.ico"/><span class="rlab">复制到 <span class="rcaret">&#x25BE;</span></span></button>
            <button class="rcmd big" id="cmd-delete"><img class="ric" src="../icons/Icons/files/delete.ico"/><span class="rlab">删除</span></button>
            <button class="rcmd big" id="cmd-rename2"><img class="ric" src="../icons/Icons/files/select.ico"/><span class="rlab">重命名</span></button>
          </div>
          <div class="rgroup-title">组织</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd big" id="cmd-newfolder2"><img class="ric" src="../icons/Icons/folders/folder.ico"/><span class="rlab">新建文件夹</span></button>
            <button class="rcmd big" id="cmd-newitem"><img class="ric" src="../icons/Icons/files/document.ico"/><span class="rlab">新建项目 <span class="rcaret">&#x25BE;</span></span></button>
            <button class="rcmd big" id="cmd-easy"><img class="ric" src="../icons/Icons/folders/desktop.ico"/><span class="rlab">轻松访问 <span class="rcaret">&#x25BE;</span></span></button>
          </div>
          <div class="rgroup-title">新建</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd big" id="cmd-props2"><img class="ric" src="../icons/Icons/files/configuration.ico"/><span class="rlab">属性</span></button>
            <button class="rcmd big" id="cmd-open2"><img class="ric" src="../icons/Icons/files/window.ico"/><span class="rlab">打开 <span class="rcaret">&#x25BE;</span></span></button>
            <div class="rstack">
              <button class="rcmd small" id="cmd-edit"><img class="ric" src="../icons/Icons/files/text.ico"/><span class="rlab">编辑</span></button>
              <button class="rcmd small" id="cmd-history"><img class="ric" src="../icons/Icons/files/history.ico"/><span class="rlab">历史记录</span></button>
            </div>
          </div>
          <div class="rgroup-title">打开</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items">
            <div class="rstack">
              <button class="rcmd small" id="cmd-selall"><img class="ric" src="../icons/Icons/files/select2.ico"/><span class="rlab">全部选择</span></button>
              <button class="rcmd small" id="cmd-selnone"><img class="ric" src="../icons/Icons/files/select.ico"/><span class="rlab">全部取消</span></button>
              <button class="rcmd small" id="cmd-selinvert"><img class="ric" src="../icons/Icons/files/select2.ico"/><span class="rlab">反向选择</span></button>
            </div>
          </div>
          <div class="rgroup-title">选择</div>
        </div>
      </div>
      <!-- 共享 -->
      <div class="rpanel" data-panel="gongxiang">
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd big" id="cmd-share"><img class="ric" src="../icons/Icons/folders/share.ico"/><span class="rlab">共享</span></button>
            <button class="rcmd big" id="cmd-email"><img class="ric" src="../icons/Icons/files/document.ico"/><span class="rlab">电子邮件</span></button>
            <button class="rcmd big" id="cmd-zip"><img class="ric" src="../icons/Icons/folders/zip.ico"/><span class="rlab">压缩</span></button>
          </div>
          <div class="rgroup-title">发送</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd big" id="cmd-sec"><img class="ric" src="../icons/Icons/devices/drives/lock.ico"/><span class="rlab">高级安全</span></button>
          </div>
          <div class="rgroup-title">高级安全</div>
        </div>
      </div>
      <!-- 查看 -->
      <div class="rpanel" data-panel="chakan">
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd" id="cmd-navpane"><img class="ric" src="../icons/Icons/folders/explorer.ico"/><span class="rlab2">导航窗格</span></button>
            <button class="rcmd" id="cmd-prevpane"><img class="ric" src="../icons/Icons/files/document.ico"/><span class="rlab2">预览窗格</span></button>
            <button class="rcmd" id="cmd-detpane"><img class="ric" src="../icons/Icons/files/configuration.ico"/><span class="rlab2">详细信息窗格</span></button>
          </div>
          <div class="rgroup-title">窗格</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items view-picker">
            <button class="rcmd vopt" data-view="xlarge"><img class="ric" src="../icons/Icons/folders/folder.ico"/><span class="rlab2">超大图标</span></button>
            <button class="rcmd vopt" data-view="large"><img class="ric" src="../icons/Icons/folders/folder.ico"/><span class="rlab2">大图标</span></button>
            <button class="rcmd vopt" data-view="medium"><img class="ric" src="../icons/Icons/folders/folder.ico"/><span class="rlab2">中图标</span></button>
            <button class="rcmd vopt" data-view="small"><img class="ric" src="../icons/Icons/folders/folder.ico"/><span class="rlab2">小图标</span></button>
            <button class="rcmd vopt" data-view="list"><img class="ric" src="../icons/Icons/folders/folder.ico"/><span class="rlab2">列表</span></button>
            <button class="rcmd vopt active" data-view="details"><img class="ric" src="../icons/Icons/folders/folder.ico"/><span class="rlab2">详细信息</span></button>
            <button class="rcmd vopt" data-view="content"><img class="ric" src="../icons/Icons/folders/folder.ico"/><span class="rlab2">内容</span></button>
          </div>
          <div class="rgroup-title">布局</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd" id="cmd-sort"><img class="ric" src="../icons/Icons/files/select2.ico"/><span class="rlab2">排序方式</span></button>
            <button class="rcmd" id="cmd-group"><img class="ric" src="../icons/Icons/folders/folder.ico"/><span class="rlab2">分组依据</span></button>
            <button class="rcmd" id="cmd-addcol"><img class="ric" src="../icons/Icons/files/select.ico"/><span class="rlab2">添加列</span></button>
            <button class="rcmd" id="cmd-fitcol"><img class="ric" src="../icons/Icons/files/configuration.ico"/><span class="rlab2">将所有列调整为合适大小</span></button>
          </div>
          <div class="rgroup-title">当前视图</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items check-col">
            <label><input type="checkbox" id="chk-ext" checked /> 文件扩展名</label>
            <label><input type="checkbox" id="chk-hidden" /> 隐藏的项目</label>
            <label><input type="checkbox" id="chk-checks" /> 项目复选框</label>
          </div>
          <div class="rgroup-title">显示/隐藏</div>
        </div>
        <div class="rgroup">
          <div class="rgroup-items">
            <button class="rcmd" id="cmd-foptions"><img class="ric" src="../icons/Icons/files/configuration2.ico"/><span class="rlab2">选项</span></button>
          </div>
          <div class="rgroup-title">选项</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ======== 导航栏 ======== -->
  <div id="navbar">
    <div class="nav-btns">
      <button id="btn-back" title="后退 (Alt+Left)">&#x2190;<span class="back-caret">&#x25BE;</span></button>
      <button id="btn-forward" title="前进 (Alt+Right)">&#x2192;</button>
      <button id="btn-up" title="向上 (Alt+Up)">&#x2191;</button>
    </div>
    <div id="addressbar">
      <div id="breadcrumb" title="地址栏（点击可编辑路径）"></div>
      <input id="addr-input" class="hidden" type="text" spellcheck="false" autocomplete="off" />
      <button id="btn-refresh" title="刷新 (F5)">&#x21BB;</button>
    </div>
    <div id="searchbox">
      <img class="search-glass" src="../icons/Icons/files/search3.ico" />
      <span class="search-divider"></span>
      <input id="search-input" type="text" placeholder='搜索"此电脑"' />
    </div>
  </div>

  <!-- ======== 主体 ======== -->
  <div id="main">
    <div id="sidebar">
      <div id="sidebar-tree"></div>
    </div>
    <div id="content-wrap">
      <div id="content"></div>
    </div>
    <div id="rightpane" class="hidden">
      <div id="preview-pane" class="hidden">
        <div class="pane-title">预览</div>
        <div id="preview-body"></div>
      </div>
      <div id="details-pane" class="hidden">
        <div class="pane-title">详细信息</div>
        <div id="details-body"></div>
      </div>
    </div>
  </div>

  <!-- ======== 状态栏 ======== -->
  <div id="statusbar">
    <span id="status-count">0 个项目</span>
    <span class="spacer"></span>
    <span id="status-detail"></span>
    <div class="status-view-btns">
      <button id="sb-details" class="active" title="详细信息视图">详细信息</button>
      <button id="sb-large" title="大图标视图">大图标</button>
    </div>
  </div>

  <!-- ======== 右键菜单 ======== -->
  <div id="ctxmenu" class="hidden"></div>

  <!-- ======== 列选择 / 分组下拉菜单 ======== -->
  <div id="dropdown" class="hidden"></div>

  <!-- ======== 属性对话框 ======== -->
  <div id="prop-overlay" class="hidden">
    <div id="prop-dialog">
      <div id="prop-title">属性</div>
      <div id="prop-body"></div>
      <div id="prop-footer"><button id="prop-ok">确定</button></div>
    </div>
  </div>

  <!-- ======== 重命名输入框 ======== -->
  <input id="rename-box" class="hidden" type="text" />

  <script src="app.js"></script>
</body>
</html>
